# ---------------------------------------------------------------------------
# Continuous Integration / Continuous Deployment for the Buscal backend.
#
# The frontend is owned by a separate team and has its own release pipeline.
# This workflow only runs when backend files change. It verifies syntax and
# exercises the API against a throwaway MongoDB service.
#
# When checks pass on the main branch, an optional deploy step pings Render to
# release the new version. That step only runs if you add a RENDER_DEPLOY_HOOK
# secret in the repo settings, so it is safe to merge this file without it.
# ---------------------------------------------------------------------------

name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buscal-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Backend: run the OKR test suite against a throwaway MongoDB container.
  # -------------------------------------------------------------------------
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        # Wait until Mongo answers before the tests start.
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # No MONGO_URI here on purpose: each test file falls back to its own
    # distinctly-named database (okr_test / okr_gov_test) when this is unset.
    # node --test runs the two files at once, so pointing them both at one
    # fixed database name made them stomp on each other's data mid-run.
    env:
      JWT_SECRET: test_secret_for_ci

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --immutable

      - name: Run backend tests
        working-directory: backend
        run: yarn test:ci

  # -------------------------------------------------------------------------
  # Deploy: only on main, only after the checks pass, and only if a Render
  # deploy hook secret exists. Add RENDER_DEPLOY_HOOK in repo Settings ->
  # Secrets to switch this on.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Trigger Render deploy (if configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK secret set. Skipping deploy."
            exit 0
          fi
          echo "Triggering Render deploy..."
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy triggered."
