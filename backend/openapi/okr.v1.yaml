openapi: 3.1.0
info:
  title: Buscal OKR API
  version: 1.0.0
  description: >
    Versioned backend contract for Micromax objective and key-result tracking.
servers:
  - url: /api/v1/okr
    description: Versioned API
tags:
  - name: Health
  - name: Objectives
  - name: Key results
  - name: Intelligence
security:
  - bearerAuth: []
paths:
  /ping:
    get:
      tags: [Health]
      summary: Check OKR module and database readiness
      security: []
      responses:
        "200":
          description: Module and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
        "503":
          description: Process is running but the database is unavailable
  /objectives:
    get:
      tags: [Objectives]
      summary: List objectives visible to the caller
      parameters:
        - in: query
          name: scope
          schema:
            type: string
            enum: [personal, team]
          description: Team scope is accepted only for manager/QM/admin users.
      responses:
        "200":
          description: Objective list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Objective"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Objectives]
      summary: Create an objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveInput"
      responses:
        "201":
          description: Objective created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /objectives/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Objectives]
      summary: Get one objective and its key results
      responses:
        "200":
          description: Objective detail
          content:
            application/json:
              schema:
                type: object
                required: [objective, keyResults]
                properties:
                  objective:
                    $ref: "#/components/schemas/Objective"
                  keyResults:
                    type: array
                    items:
                      $ref: "#/components/schemas/KeyResult"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Objectives]
      summary: Update editable objective fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectiveInput"
      responses:
        "200":
          description: Objective updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Objective"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Objectives]
      summary: Delete an objective and its dependent OKR records
      responses:
        "200":
          description: Objective deleted
        "403":
          $ref: "#/components/responses/Forbidden"
  /objectives/{id}/key-results:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Key results]
      summary: Add a weighted key result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyResultInput"
      responses:
        "201":
          description: Key result created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyResult"
        "400":
          description: Invalid input or total weight would exceed 100
        "403":
          $ref: "#/components/responses/Forbidden"
  /objectives/{id}/weight-check:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Objectives]
      summary: Return allocated and remaining key-result weight
      responses:
        "200":
          description: Weight summary
          content:
            application/json:
              schema:
                type: object
                required: [total, remaining, isValid]
                properties:
                  total: { type: number, minimum: 0, maximum: 100 }
                  remaining: { type: number, minimum: 0, maximum: 100 }
                  isValid: { type: boolean }
  /objectives/{id}/forecast:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Intelligence]
      summary: Forecast whether an objective will finish on time
      responses:
        "200":
          description: Pace forecast
  /objectives/{id}/trend:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Intelligence]
      summary: Return chart-ready objective progress points
      responses:
        "200":
          description: Progress trend
  /key-results/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      tags: [Key results]
      summary: Update editable key-result fields
      responses:
        "200":
          description: Key result updated
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Key results]
      summary: Delete a key result and its check-in history
      responses:
        "200":
          description: Key result deleted
        "403":
          $ref: "#/components/responses/Forbidden"
  /key-results/{id}/progress:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [Key results]
      summary: Update progress and recalculate the objective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [progress]
              properties:
                progress:
                  type: number
                  minimum: 0
                  maximum: 100
      responses:
        "200":
          description: Progress updated
        "403":
          $ref: "#/components/responses/Forbidden"
  /key-results/{id}/check-in:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [Key results]
      summary: Record a dated progress check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [progress]
              properties:
                progress:
                  type: number
                  minimum: 0
                  maximum: 100
                note:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Check-in recorded
  /key-results/{id}/history:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Key results]
      summary: List check-ins oldest first
      responses:
        "200":
          description: Check-in history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckIn"
  /key-results/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [Key results]
      summary: Approve completion or request changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                completionJustification:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Approval state updated
        "403":
          $ref: "#/components/responses/Forbidden"
  /summary:
    get:
      tags: [Intelligence]
      summary: Return dashboard-ready OKR totals
      responses:
        "200":
          description: Summary
  /my-key-results:
    get:
      tags: [Key results]
      summary: List key results assigned to the caller
      responses:
        "200":
          description: Assigned key results
  /insights:
    get:
      tags: [Intelligence]
      summary: Return prioritized plain-English findings
      responses:
        "200":
          description: Insight list
  /activity:
    get:
      tags: [Intelligence]
      summary: Return recent OKR audit activity
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Activity list
  /leaderboard:
    get:
      tags: [Intelligence]
      summary: Rank contributors within the caller's objective scope
      responses:
        "200":
          description: Ranked contributor list
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
  schemas:
    Ping:
      type: object
      required: [ok, module, message, db, uptimeSeconds]
      properties:
        ok: { type: boolean }
        module: { type: string, const: okr }
        message: { type: string }
        db: { type: string, enum: [connected, disconnected] }
        uptimeSeconds: { type: integer, minimum: 0 }
    ObjectiveInput:
      type: object
      required: [title, dueDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 140 }
        description: { type: string, maxLength: 2000 }
        type:
          type: string
          enum: [company, department, team, individual]
        startDate: { type: string, format: date-time }
        dueDate: { type: string, format: date-time }
        approvalState:
          type: string
          enum: [draft, pending, approved, changes-requested]
    Objective:
      allOf:
        - $ref: "#/components/schemas/ObjectiveInput"
        - type: object
          required: [_id, owner, progress, status, createdAt, updatedAt]
          properties:
            _id: { type: string }
            owner: {}
            progress: { type: number, minimum: 0, maximum: 100 }
            status:
              type: string
              enum: [on-track, at-risk, overdue, completed]
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    KeyResultInput:
      type: object
      required: [title, weight, dueDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        weight: { type: number, minimum: 0, maximum: 100 }
        progress: { type: number, minimum: 0, maximum: 100, default: 0 }
        assignedTo: { type: [string, "null"] }
        dueDate: { type: string, format: date-time }
        completionJustification: { type: string, maxLength: 1000 }
    KeyResult:
      allOf:
        - $ref: "#/components/schemas/KeyResultInput"
        - type: object
          required: [_id, objective, status, approved, createdAt, updatedAt]
          properties:
            _id: { type: string }
            objective: { type: string }
            status:
              type: string
              enum: [on-track, at-risk, overdue, completed]
            approved: { type: boolean }
            approvedBy: { type: [string, "null"] }
            approvedAt: { type: [string, "null"], format: date-time }
            calendarTaskId: { type: [string, "null"] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CheckIn:
      type: object
      required: [_id, keyResult, objective, user, progress, createdAt]
      properties:
        _id: { type: string }
        keyResult: { type: string }
        objective: { type: string }
        user: {}
        progress: { type: number, minimum: 0, maximum: 100 }
        note: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        requestId: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
